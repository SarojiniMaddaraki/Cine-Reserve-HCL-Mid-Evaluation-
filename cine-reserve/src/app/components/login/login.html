<div class="login-page">

  <div class="login-left">
    <div class="brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">CINE<em>RESERVE</em></span>
    </div>
    <h2 class="tagline">The finest <em>cinema</em><br>experience awaits.</h2>
    <p class="sub">12 blockbuster films. Premium seating.<br>Seamless booking in seconds.</p>

    <div class="feature-list">
      <div class="feature">✦ &nbsp; Instant seat selection</div>
      <div class="feature">✦ &nbsp; Multiple showtimes</div>
      <div class="feature">✦ &nbsp; Secure JWT booking</div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">

      <div class="tab-switch">
        <button [class.active]="!isRegister" (click)="toggle()">Sign In</button>
        <button [class.active]="isRegister" (click)="toggle()">Register</button>
      </div>

      <form (ngSubmit)="submit()">

        <div class="field" *ngIf="isRegister">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="name" name="name" placeholder="Your name" required>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

        <button class="btn-submit" type="submit" [disabled]="loading">
          <span *ngIf="!loading">{{ isRegister ? 'Create Account' : 'Sign In →' }}</span>
          <span *ngIf="loading" class="spinner">◌</span>
        </button>

      </form>

    </div>
  </div>

</div>
